version: '3.8'

services:
  # 1. Redis: Job Queue, Rate Limiter, and Auth Cache
  nexus-redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - nexus-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  # 2. Database: Ledger & Cost Auditing
  nexus-db:
    image: mysql:8.0
    container_name: nexus-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nexus_db
      MYSQL_USER: nexus_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - nexus-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # 3. Gateway: FastAPI ASGI Application
  nexus-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-gateway
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8100 --workers 4
    ports:
      - "127.0.0.1:8100:8100"
    env_file:
      - .env
    environment:
      - MYSQL_HOST=nexus-db
      - REDIS_HOST=nexus-redis
    depends_on:
      nexus-redis:
        condition: service_healthy
      nexus-db:
        condition: service_healthy
    networks:
      - nexus-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # 4. Worker: Background arq task queue processor
  nexus-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: arq worker.WorkerSettings
    env_file:
      - .env
    environment:
      - MYSQL_HOST=nexus-db
      - REDIS_HOST=nexus-redis
    depends_on:
      nexus-redis:
        condition: service_healthy
      nexus-db:
        condition: service_healthy
    networks:
      - nexus-internal
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # 5. Admin Dashboard: Streamlit Application
  nexus-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-admin
    restart: always
    command: streamlit run modules/admin/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    environment:
      - MYSQL_HOST=nexus-db
      - REDIS_HOST=nexus-redis
    depends_on:
      nexus-gateway:
        condition: service_started
    networks:
      - nexus-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  nexus-internal:
    driver: bridge

volumes:
  redis-data:
  mysql-data:
